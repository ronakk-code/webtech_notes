<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" style="border: 10px solid" >
        <h2>REGISTRATION FORM</h2>
        <label for="">first name</label>
        <input type="text" placeholder="enter first name" required> <br>

        lastname: <input type="text" placeholder="enter last name"> <br>

        email: <input type="email" placeholder="john@gmail.com" autofocus> <br>

        password: <input type="password" placeholder="pass" minlength="4" maxlength="8"> <br>

        phone: <input type="tel" value= "6269811708" readonly> <br>

        age: <input type="number"> <br>

        <label for="gen">gender :</label>
        <input type="radio" name="gen">male
        <input type="radio" name="gen">female
        <input type="radio" name="gen">other <br>

        <label for="hob">hobbies :</label>
        <input type="checkbox" name="hob">singing
        <input type="checkbox" name="hob">dancing
        <input type="checkbox" name="hob">playing <br>

        range: <input type="range"> <br>

        <select name="courses" required>
            <option value=""></option>
            <option value="MCA">MCA</option>
            <option value="BCA">BCA</option>
            <option value="MTECH">MTECH</option>
            <option value="BTECH">BTECH</option>
            
        </select> <br>

        date: <input type="date"> <br>
        date time: <input type="datetime"> <br>
        date time: <input type="datetime-local"> <br>
        add: <textarea name="" id=""> local addres</textarea> <br>


        <button type="submit">submit</button>
        <button type="reset">reset</button>

        


    </form>

</body>
</html>
