<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 300px;
            width: 300px;
            background: url(../DAY2/images/rahul.webp) no-repeat center/cover;
            margin: 60px auto;
        }
        .text{
            position: absolute;
            top: 45%;
            left: 50%;
            width: 100px;
            background-color: black;
            border-radius: 10px;
            opacity: 0.3;
        }
        .content{
            position: absolute;
            top: 45%;
            left: 51%;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text">text</div>
        <div class="content">hello opacity</div>
    </div>
</body>
</html>
