<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            height: 500px;
            width: 500px;
            border: 1px dotted;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box1{
          height: 200px;
          width: 200px; 
          border: 1px solid;
          display: flex; 
          justify-content: center;
          align-items: center;

          animation-name: BOX;
          animation-duration: 8s;
          position: relative;
        }
        @keyframes BOX{}
    </style>
</head>
<body>
    <div id="container">
        <div class="box1">BOUNCE</div>
    </div>
</body>
</html>
